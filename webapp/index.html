<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>አጋዥ — Amharic Voice AI</title>
  <meta name="description" content="Intelligent Amharic Voice AI Assistant Telegram Mini App">

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts: Noto Sans Ethiopic & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@300;400;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-bottom"></div>

  <div class="app-container" id="appContainer">
    <!-- Header -->
    <header class="app-header">
      <div class="user-pill" id="userPill">
        <div class="avatar-ring" id="userAvatar">አ</div>
        <div class="user-meta">
          <span class="user-name" id="userName">እንኳን ደህና መጡ</span>
          <span class="status-indicator">
            <span class="dot"></span> Online
          </span>
        </div>
      </div>
      <div class="header-badges">
        <span class="badge gemini-badge">⚡ Gemini 2.5</span>
      </div>
    </header>

    <!-- Main Chat Feed -->
    <main class="chat-feed" id="chatFeed">
      <!-- Welcome Hero Card -->
      <div class="welcome-card glass-panel" id="welcomeCard">
        <div class="hero-icon-container">
          <div class="icon-pulse-ring"></div>
          <div class="hero-icon">🎙️</div>
        </div>
        <h1 class="hero-title">የአማርኛ ድምፅ ረዳት</h1>
        <p class="hero-subtitle">የፈለጉትን ጥያቄ በድምፅ ወይም በፅሁፍ ይጠይቁ፣ አጋዥ በአማርኛ ይመልሳል!</p>

        <!-- Topic Suggestion Chips -->
        <div class="suggestion-section">
          <span class="section-label">የተመረጡ ጥያቄዎች (Suggested Topics):</span>
          <div class="chips-container" id="chipsContainer">
            <button class="chip" data-query="ስለ ኢትዮጵያ ታሪክ ባጭሩ ንገረኝ">
              🇪🇹 ስለ ኢትዮጵያ ታሪክ
            </button>
            <button class="chip" data-query="ዛሬ እንዴት ልትረዳኝ ትችላለህ?">
              💡 ምን ምን ትችላለህ?
            </button>
            <button class="chip" data-query="ምርጥ ባህላዊ የኢትዮጵያ ምግቦች የትኞቹ ናቸው?">
              🍲 ባህላዊ ምግቦች
            </button>
            <button class="chip" data-query="ቀላል የአማርኛ ግጥም ንገረኝ">
              📜 የአማርኛ ግጥም
            </button>
          </div>
        </div>
      </div>

      <!-- Messages container -->
      <div class="messages-list" id="messagesList"></div>
    </main>

    <!-- Visualizer overlay during recording -->
    <div class="visualizer-bar-container" id="visualizerContainer">
      <canvas id="waveformCanvas" width="360" height="70"></canvas>
      <div class="recording-timer" id="recordingTimer">00:00</div>
    </div>

    <!-- Voice Recording & Input Dock -->
    <footer class="app-dock glass-panel">
      <!-- Text / Voice Toggle Input Bar -->
      <div class="input-row">
        <div class="text-input-wrapper">
          <input 
            type="text" 
            id="textInput" 
            placeholder="በአማርኛ ይፃፉ ወይም ድምፅ ይቅረጹ..." 
            autocomplete="off"
          />
          <button class="send-btn" id="sendBtn" title="Send message" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>

        <!-- Big Mic Button -->
        <button class="mic-button" id="micBtn" title="Hold or tap to speak" aria-label="Microphone">
          <div class="mic-ripple"></div>
          <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </button>
      </div>

      <div class="dock-footer-hints">
        <span id="dockHint">ማይክሮፎኑን ተጭነው በአማርኛ ይናገሩ 🎤</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
